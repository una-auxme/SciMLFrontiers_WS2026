<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img"
     aria-label="A smooth continuous curve approximated by a discrete polyline">
  <rect width="512" height="512" rx="28" fill="#F4F8FA"/>

  <!-- continuous solution -->
  <path d="M 88 300 Q 172 110 256 260 T 424 180" fill="none" stroke="#024F89"
        stroke-width="16" stroke-linecap="round" opacity="0.28"/>

  <!-- discrete approximation through the sample points -->
  <path d="M 88 300 L 172 195 L 256 260 L 340 315 L 424 180" fill="none" stroke="#024F89"
        stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- sample points -->
  <g fill="#024F89">
    <circle cx="88" cy="300" r="16"/>
    <circle cx="172" cy="195" r="16"/>
    <circle cx="256" cy="260" r="16"/>
    <circle cx="340" cy="315" r="16"/>
    <circle cx="424" cy="180" r="16"/>
  </g>

  <text x="256" y="470" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="24" fill="#024F89" opacity="0.55">AI Generated Image</text>
</svg>
