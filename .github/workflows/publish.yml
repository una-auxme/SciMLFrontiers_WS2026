on:
  workflow_dispatch:
  push:
    branches: main

name: Publish Quarto website

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render website
        run: quarto render website

      - name: Add licence notices to the rendered site
        run: cp LICENSE THIRD_PARTY_NOTICES.md website/_site/

      - name: Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          path: website
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
