      <rect x="364" y="306" width="26" height="26" rx="5" transform="rotate(240 377 368)"/>
      <rect x="364" y="306" width="26" height="26" rx="5" transform="rotate(300 377 368)"/>
    </g>
    <circle cx="377" cy="368" r="46"/>
  </g>
  <circle cx="377" cy="368" r="18" fill="#F4F8FA"/>

  <text x="256" y="470" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="24" fill="#D69220" opacity="0.62">AI Generated Image</text>
