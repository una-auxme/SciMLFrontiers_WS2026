<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img"
     aria-label="Two interlocking gears representing automated, scalable workflows">
  <rect width="512" height="512" rx="28" fill="#F4F8FA"/>

  <!-- large gear -->
  <g fill="#D69220">
    <g>
      <rect x="204" y="128" width="40" height="40" rx="7"/>
      <rect x="204" y="128" width="40" height="40" rx="7" transform="rotate(45 224 236)"/>
      <rect x="204" y="128" width="40" height="40" rx="7" transform="rotate(90 224 236)"/>
      <rect x="204" y="128" width="40" height="40" rx="7" transform="rotate(135 224 236)"/>
      <rect x="204" y="128" width="40" height="40" rx="7" transform="rotate(180 224 236)"/>
      <rect x="204" y="128" width="40" height="40" rx="7" transform="rotate(225 224 236)"/>
      <rect x="204" y="128" width="40" height="40" rx="7" transform="rotate(270 224 236)"/>
      <rect x="204" y="128" width="40" height="40" rx="7" transform="rotate(315 224 236)"/>
    </g>
