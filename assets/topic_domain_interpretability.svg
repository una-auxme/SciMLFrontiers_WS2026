<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img"
     aria-label="A magnifying glass revealing hidden structure in the data">
  <rect width="512" height="512" rx="28" fill="#F4F8FA"/>

  <!-- unresolved data outside the lens -->
  <g fill="#4E9E52" opacity="0.28">
    <circle cx="112" cy="146" r="17"/>
    <circle cx="196" cy="106" r="14"/>
    <circle cx="118" cy="252" r="14"/>
    <circle cx="150" cy="372" r="16"/>
    <circle cx="262" cy="404" r="13"/>
    <circle cx="332" cy="112" r="15"/>
  </g>

  <!-- lens interior -->
  <circle cx="288" cy="272" r="112" fill="#FFFFFF"/>

  <!-- structure revealed inside: a trend through the points -->
  <path d="M 208 330 L 254 288 L 296 302 L 356 220" fill="none" stroke="#4E9E52"
        stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#4E9E52">
    <circle cx="208" cy="330" r="13"/>
    <circle cx="254" cy="288" r="13"/>
    <circle cx="296" cy="302" r="13"/>
    <circle cx="356" cy="220" r="13"/>
  </g>

  <!-- rim and handle -->
  <circle cx="288" cy="272" r="112" fill="none" stroke="#4E9E52" stroke-width="17"/>
  <line x1="370" y1="354" x2="436" y2="420" stroke="#4E9E52" stroke-width="26" stroke-linecap="round"/>

  <text x="256" y="470" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="24" fill="#4E9E52" opacity="0.62">AI Generated Image</text>
</svg>
